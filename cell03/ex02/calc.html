<!DOCTYPE html>
<html>
<head>

    <title>Calculator</title>

    <link
        rel="stylesheet"
        href="calc.css"
    >

</head>

<body>

    <div class="calculator">

        <input
            id="left"
            type="text"
        >

        <select id="operator">

            <option value="+">
                +
            </option>

            <option value="-">
                -
            </option>

            <option value="*">
                *
            </option>

            <option value="/">
                /
            </option>

            <option value="%">
                %
            </option>

        </select>

        <input
            id="right"
            type="text"
        >

        <input
            id="submit"
            type="submit"
            value="Try me!"
        >

    </div>

    <script src="calc.js"></script>

</body>
</html>
