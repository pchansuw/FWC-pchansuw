<!DOCTYPE html>
<html>
<head>
    <title>Tab</title>
</head>

<body>

    <table style="
        width: 100%;
        border-collapse: collapse;
    ">

        <tr>

            <td style="
                background-color: lightgreen;
                height: 150px;
                border: 1px solid black;
            ">
                First cell
            </td>

            <td style="
                background-color: lightpink;
                height: 150px;
                border: 1px solid black;
            ">
                Second cell
            </td>

        </tr>

    </table>

</body>
</html>
